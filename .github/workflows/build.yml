name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ScreenCopy.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCopy-APK
          path: out/ScreenCopy.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ScreenCopy (son sürüm)
          files: out/ScreenCopy.apk
          body: |
            ScreenCopy APK — her `main` push'unda otomatik güncellenir.
            Telefona kurmak için indirip açın (Bilinmeyen kaynaklara izin vermeniz gerekebilir).
